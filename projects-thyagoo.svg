<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="860" height="560" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="859" height="559" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="28" x2="860" y2="28" stroke="#30363d"/>

  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>

  <text x="430" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">thyagoo-dev@github: ~/projects</text>

  <g transform="translate(30, 58)">
    <style>
      .txt {
        fill: #c9d1d9;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hl { fill: #22d3ee; font-weight: bold; font-size: 13.6px; }
      .success { fill: #39d353; font-weight: bold; font-size: 11.2px; }
      .warn { fill: #f2cc60; font-weight: bold; font-size: 11.2px; }
      .dim { fill: #8b949e; font-size: 10.8px; }
      .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .fade-in { opacity: 0; animation: fadeIn .5s forwards; }
      @keyframes fadeIn { to { opacity: 1; } }

      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
      .iconBox { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
      .iconText {
        fill: #79c0ff;
        font-weight: bold;
        font-size: 9.5px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>

    <text class="txt" y="0" font-size="14px">
      <tspan fill="#39d353">thyagoo-dev@github</tspan>:<tspan fill="#79c0ff">~</tspan>$ ./projects.sh
    </text>

    <!-- 1. Hipocampo -->
    <g transform="translate(0, 28)" class="fade-in" style="animation-delay:.2s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">H</text>
      <text class="hl" x="52" y="29">Hipocampo</text>
      <text class="warn" x="20" y="50">◌ In development</text>
      <text class="dim" x="20" y="67">React · TypeScript · Tailwind · Auth0</text>
    </g>

    <!-- 2. Mofidax -->
    <g transform="translate(420, 28)" class="fade-in" style="animation-delay:.3s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">M</text>
      <text class="hl" x="52" y="29">Mofidax</text>
      <text class="success" x="20" y="50">✓ Live</text>
      <text class="dim" x="20" y="67">React · TypeScript · Tailwind · JavaScript</text>
    </g>

    <!-- 3. TH Quiz Multiplayer -->
    <g transform="translate(0, 110)" class="fade-in" style="animation-delay:.4s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">Q</text>
      <text class="hl" x="52" y="29">TH Quiz Multiplayer</text>
      <text class="success" x="20" y="50">✓ Live</text>
      <text class="dim" x="20" y="67">React · Node.js · Socket.io · Tailwind</text>
    </g>

    <!-- 4. Conecta Iguatu -->
    <g transform="translate(420, 110)" class="fade-in" style="animation-delay:.5s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">CI</text>
      <text class="hl" x="52" y="29">Conecta Iguatu</text>
      <text class="success" x="20" y="50">✓ Live <tspan class="warn">· private repo</tspan></text>
      <text class="dim" x="20" y="67">PWA · Supabase · Leaflet · JavaScript</text>
    </g>

    <!-- 5. Yu-Gi-Oh! Multiverse -->
    <g transform="translate(0, 192)" class="fade-in" style="animation-delay:.6s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">YG</text>
      <text class="hl" x="52" y="29">Yu-Gi-Oh! Multiverse</text>
      <text class="success" x="20" y="50">✓ Live</text>
      <text class="dim" x="20" y="67">JavaScript · HTML · CSS · JSON</text>
    </g>

    <!-- 6. Q-Academico API -->
    <g transform="translate(420, 192)" class="fade-in" style="animation-delay:.7s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">QA</text>
      <text class="hl" x="52" y="29">Q-Acadêmico API</text>
      <text class="warn" x="20" y="50">◌ Private</text>
      <text class="dim" x="20" y="67">Java · Spring Boot · Web Scraping</text>
    </g>

    <!-- 7. TaskManager API -->
    <g transform="translate(0, 274)" class="fade-in" style="animation-delay:.8s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">TM</text>
      <text class="hl" x="52" y="29">TaskManager API</text>
      <text class="success" x="20" y="50">✓ Public</text>
      <text class="dim" x="20" y="67">Java 17 · Spring Boot · JPA · JWT</text>
    </g>

    <!-- 8. Portfolio -->
    <g transform="translate(420, 274)" class="fade-in" style="animation-delay:.9s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">CT</text>
      <text class="hl" x="52" y="29">Cicero Thyago Portfolio</text>
      <text class="success" x="20" y="50">✓ Live</text>
      <text class="dim" x="20" y="67">React · TypeScript · Vite · Tailwind</text>
    </g>

    <!-- 9. iCome API -->
    <g transform="translate(0, 356)" class="fade-in" style="animation-delay:1.0s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">IC</text>
      <text class="hl" x="52" y="29">iCome API</text>
      <text class="warn" x="20" y="50">◌ Private</text>
      <text class="dim" x="20" y="67">Java · Spring Boot · Jsoup · REST</text>
    </g>

    <!-- 10. Meu IFCE -->
    <g transform="translate(420, 356)" class="fade-in" style="animation-delay:1.1s">
      <rect class="card" width="380" height="78" rx="8"/>
      <rect class="iconBox" x="20" y="13" width="24" height="24" rx="5"/>
      <text class="iconText" x="32" y="25">MI</text>
      <text class="hl" x="52" y="29">Meu IFCE</text>
      <text class="success" x="20" y="50">✓ Live <tspan class="warn">· private repo</tspan></text>
      <text class="dim" x="20" y="67">Next.js · TypeScript · IFCE ecosystem</text>
    </g>

    <!-- prompt -->
    <g transform="translate(0, 466)" class="fade-in" style="animation-delay:1.25s">
      <text class="txt" y="0" font-size="14px">
        <tspan fill="#39d353">thyagoo-dev@github</tspan>:<tspan fill="#79c0ff">~</tspan>$ <tspan class="cursor">█</tspan>
      </text>
    </g>
  </g>
</svg>
