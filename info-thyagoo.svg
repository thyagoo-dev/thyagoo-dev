<svg xmlns="http://www.w3.org/2000/svg" width="490" height="450" viewBox="0 0 490 450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="terminal-clip">
      <rect x="0" y="29" width="490" height="421" />
    </clipPath>
  </defs>
  <rect width="490" height="450" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="489" height="449" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="28" x2="490" y2="28" stroke="#30363d"/>
  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>
  <text x="245" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">thyagoo-dev@github: ~$ cat info.txt</text>

  <style>
    .title { fill: #22d3ee; font-weight: bold; font-size: 16px; }
    .header { fill: #f2cc60; font-weight: bold; font-size: 14px; }
    .label { fill: #39d353; font-weight: bold; }
    .text { fill: #c9d1d9; font-size: 13px; }
    .dim { fill: #7d8590; font-size: 13px; }
  </style>

  <g clip-path="url(#terminal-clip)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="30 420"
        to="30 -980"
        dur="30s"
        repeatCount="indefinite" />

      <!-- Identity -->
      <text y="0" class="title">Cicero Thyago</text>
      <text y="20" class="dim">------------------------------------------</text>
      <text y="45" class="text"><tspan class="label">Role   </tspan>   Computer Science Student</text>
      <text y="70" class="text"><tspan class="label">College</tspan>   IFCE — Bachelor in Computer Science</text>
      <text y="95" class="text"><tspan class="label">Focus  </tspan>   Software Development, Java, Web Applications</text>
      <text y="120" class="text"><tspan class="label">Stack  </tspan>   Java, Spring Boot, React, TypeScript, Tailwind</text>

      <!-- About -->
      <text y="160" class="dim">------------------------------------------</text>
      <text y="190" class="header">About Me</text>
      <text y="215" class="text">  • Passionate about technology and building software</text>
      <text y="235" class="text">  • Interested in clean code, architecture, and learning</text>
      <text y="255" class="text">  • Always improving through studies and practical projects</text>

      <!-- Learning -->
      <text y="295" class="dim">------------------------------------------</text>
      <text y="325" class="header">Currently Learning</text>
      <text y="350" class="text">  • <tspan class="label">Java</tspan> — sharpening core and backend skills</text>
      <text y="370" class="text">  • <tspan class="label">Full Cycle</tspan> — software engineering mindset</text>
      <text y="390" class="text">  • <tspan class="label">Theory of Computation</tspan> — academic foundations</text>
      <text y="410" class="text">  • <tspan class="label">Software Architecture</tspan> — structure and scalability</text>

      <!-- Projects -->
      <text y="450" class="dim">------------------------------------------</text>
      <text y="480" class="header">Featured Projects</text>

      <text y="505" class="text">  • <tspan class="label">Hipocampo</tspan></text>
      <text y="525" class="text">    Modular personal workspace inspired by</text>
      <text y="545" class="text">    Notion and Obsidian for notes, studies, and knowledge</text>
      <text y="565" class="text">    Built with React, TypeScript, Tailwind CSS, and Auth0</text>

      <text y="595" class="text">  • <tspan class="label">Mofidax</tspan></text>
      <text y="615" class="text">    File conversion platform inspired by iLovePDF</text>
      <text y="635" class="text">    focused on simplicity and multiple formats</text>
      <text y="655" class="text">    Built with React, TypeScript, Tailwind CSS, and JavaScript</text>

      <!-- Connect -->
      <text y="695" class="dim">------------------------------------------</text>
      <text y="725" class="header">Connect &amp; Links</text>
      <text y="750" class="text"><tspan class="label">GitHub   </tspan> github.com/thyagoo-dev</text>
      <text y="775" class="text"><tspan class="label">LinkedIn </tspan> linkedin.com/in/thyagoodev</text>
      <text y="800" class="text"><tspan class="label">Instagram</tspan> instagram.com/yhtdev</text>

      <!-- EOF / End blocks -->
      <g transform="translate(0, 845)">
        <rect x="0" y="0" width="14" height="14" fill="#000000" />
        <rect x="14" y="0" width="14" height="14" fill="#ff5555" />
        <rect x="28" y="0" width="14" height="14" fill="#50fa7b" />
        <rect x="42" y="0" width="14" height="14" fill="#f1fa8c" />
        <rect x="56" y="0" width="14" height="14" fill="#bd93f9" />
        <rect x="70" y="0" width="14" height="14" fill="#ff79c6" />
        <rect x="84" y="0" width="14" height="14" fill="#8be9fd" />
        <rect x="98" y="0" width="14" height="14" fill="#bbbbbb" />
      </g>
    </g>
  </g>
</svg>
