<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="420" height="200" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="419" height="199" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="28" x2="420" y2="28" stroke="#30363d"/>

  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>
  <text x="210" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">~/projects/hipocampo</text>

  <style>
    .txt { fill: #c9d1d9; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hl { fill: #22d3ee; font-weight: bold; font-size: 16px; }
    .dim { fill: #8b949e; font-size: 12.5px; }
    .warn { fill: #f2cc60; font-size: 12px; font-weight: bold; }
    .fade-in { opacity: 0; animation: fadeIn 0.5s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
  </style>

  <g transform="translate(20, 58)">
    <text class="txt" y="0">
      <tspan fill="#39d353">thyagoo-dev</tspan>:<tspan fill="#79c0ff">~/projects</tspan>$ cat hipocampo.md
    </text>

    <g transform="translate(0, 24)" class="fade-in" style="animation-delay: 0.2s">
      <rect class="card" width="380" height="104" rx="8"/>
      <text class="hl" x="20" y="28">Hipocampo</text>
      <text class="dim" x="20" y="50">Modular Personal Workspace</text>
      <text class="txt" x="20" y="72" font-size="12px">• Notes, studies, projects, and knowledge</text>
      <text class="warn" x="20" y="92">status: in development</text>
    </g>
  </g>
</svg>